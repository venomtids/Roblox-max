name: Gerar executavel Windows

on:
  push:
    branches:
      - arena/01a007df-roblox-max
    paths:
      - "roblox_fixer_launcher.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar EXE (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: py -m pip install --disable-pip-version-check -r requirements.txt

      - name: Gerar executavel sem console
        run: >-
          py -m PyInstaller
          --noconsole
          --onefile
          --uac-admin
          --clean
          --name "Roblox-Fixer-Launcher-Pro"
          --collect-all customtkinter
          roblox_fixer_launcher.py

      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Fixer-Launcher-Pro-Windows-x64
          path: dist/Roblox-Fixer-Launcher-Pro.exe
          if-no-files-found: error
          retention-days: 90
